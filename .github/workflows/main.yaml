name: Build, release, and deploy

on:
  push:
    branches:
      - main
      - "build/*"
      - "chore/*"
      - "ci/*"
      - "docs/*"
      - "feat/*"
      - "fix/*"
      - "perf/*"
      - "refactor/*"
      - "revert/*"
      - "style/*"
      - "test/*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build theme and sample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Configure release metadata and site
        if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $theme = Get-Content -LiteralPath "src/theme.json" -Raw | ConvertFrom-Json
          $theme.version = $version
          $theme | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath "src/theme.json"

          $settings = Get-Content -LiteralPath "sample/appsettings.json" -Raw | ConvertFrom-Json
          $settings.Site.BaseUrl = "/shearlight/"
          $settings.Site.SiteUrl = "https://getscissorhands.app"
          $settings | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath "sample/appsettings.json"

      - name: Link sample theme
        shell: pwsh
        run: |
          $settings = Get-Content -LiteralPath "sample/appsettings.json" -Raw | ConvertFrom-Json
          $theme = $settings.Site.Theme
          if ([string]::IsNullOrWhiteSpace($theme)) {
            throw "Site:Theme must identify the sample theme."
          }
          $linkPath = Join-Path "sample/themes" $theme
          if (-not (Test-Path -LiteralPath $linkPath)) {
            New-Item -ItemType Directory -Path "sample/themes" -Force | Out-Null
            New-Item -ItemType SymbolicLink -Path $linkPath -Target "../../src" | Out-Null
          }

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # Uncomment after adding test projects to the solution.
      # - name: Test solution
      #   run: dotnet test --configuration Release --no-build --no-restore

      - name: Package theme
        if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          mkdir -p published
          (cd src && zip -r "../published/shearlight-${GITHUB_REF_NAME}.zip" . -x "bin/*" "obj/*")

      - name: Upload release artifact
        if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-artifact
          path: published/*.zip
          if-no-files-found: error

      - name: Generate production sample
        if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
        working-directory: sample
        run: dotnet run --configuration Release --no-build --no-restore -- --build

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: sample/dist

  release:
    name: Create GitHub release
    if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-artifact
          path: published

      - name: Create release with theme archive
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: published/*.zip
          generate_release_notes: true

  deploy:
    name: Deploy production sample to GitHub Pages
    if: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
